<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etiquetas HDMS - ILM</title>
  <style>
    /* ===== CSS ORIGINAL (sin cambios) ===== */
    @page {
      size: 76.2mm 47mm;
      margin: 0;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      box-sizing: border-box;
      font-weight: bold;
    }

    .etiqueta {
      width: 76.2mm;
      height: 47mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .etiqueta:not(:last-child) {
      page-break-after: always;
    }

    .header-band {
      background-color: #f0f0f0;
      padding: 6px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ccc;
    }

    .header-band img {
      height: 60px;
      object-fit: contain;
    }

    .info {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .visitor-label { font-size: 18px; margin-bottom: 4px; }
    .name          { font-size: 26px; margin-bottom: 4px; line-height: 1.1; }
    .entry-label   { font-size: 14px; margin-bottom: 2px; }
    .timestamp     { font-size: 14px; color: #000; }

    /* ===== CORRECCIONES FUNCIONALES (borra este bloque si no las quieres) ===== */
    /* evita que el logo de ILM se corte por desborde horizontal */
    .header-band img { max-width: 46%; min-width: 0; width: auto; }
    /* evita que un nombre largo parta la etiqueta en dos hojas */
    .etiqueta { overflow: hidden; }
    .info     { min-height: 0; overflow: hidden; width: 100%; }
    .name     { width: 100%; overflow-wrap: anywhere; }
    /* fuerza impresion del fondo gris */
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    /* salto de pagina correcto (el :not(:last-child) falla por el <script>) */
    .etiqueta:not(:last-child) { page-break-after: auto; }
    .etiqueta + .etiqueta { break-before: page; page-break-before: always; }

    /* ===== BARRA DE CONTROL (nunca se imprime) ===== */
    #barra {
      font-family: Arial, sans-serif; font-size: 14px;
      padding: 10px 14px; background: #1f1f1f; color: #fff;
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    }
    #barra button {
      font: inherit; font-weight: bold; padding: 8px 18px; cursor: pointer;
      border: 0; border-radius: 4px; background: #fff; color: #1f1f1f;
    }
    #barra .err { color: #ff8a80; }
    @media print { #barra { display: none !important; } }
  </style>
</head>
<body>
  <div id="barra">
    <button type="button" id="btn">Imprimir</button>
    <span id="estado"></span>
  </div>

  <div id="contenedor"></div>

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // Lee parametros de ?query y tambien de #hash
  var p = new URLSearchParams(location.search);
  if (location.hash.length > 1) {
    new URLSearchParams(location.hash.slice(1)).forEach(function (v, k) {
      p.append(k, v);
    });
  }

  var estado = document.getElementById("estado");

  // Dos formatos de entrada:
  //   1) ?n=NOMBRE&h=HORA   (repetible)
  //   2) ?d=<JSON base64url>  -> [{"n":"NOMBRE","h":"HORA"}, ...]
  var filas = [];
  var d = p.get("d");
  if (d) {
    try {
      var b64 = d.replace(/-/g, "+").replace(/_/g, "/");
      while (b64.length % 4) b64 += "=";
      var json = decodeURIComponent(escape(atob(b64)));
      filas = JSON.parse(json);
      if (!Array.isArray(filas)) filas = [filas];
    } catch (e) {
      estado.innerHTML = '<span class="err">Parametro d invalido: ' + esc(e.message) + '</span>';
      return;
    }
  } else {
    var ns = p.getAll("n"), hs = p.getAll("h");
    filas = ns.map(function (n, i) { return { n: n, h: hs[i] || "" }; });
  }

        '<div class="timestamp">' + esc(f.h) + '</div>' +
      '</div>' +
    '</div>';
  }).join("");

  // Reduce el nombre hasta que quepa (evita etiquetas partidas en dos)
  function ajustar() {
    document.querySelectorAll(".etiqueta").forEach(function (et) {
      var info = et.querySelector(".info");
      var name = et.querySelector(".name");
      var size = TAM_NOMBRE_MAX;
      name.style.fontSize = size + "px";
      while (info.scrollHeight > info.clientHeight && size > TAM_NOMBRE_MIN) {
        name.style.fontSize = (--size) + "px";
      }
    });
  }

  estado.textContent = filas.length + " etiqueta(s)";
  document.getElementById("btn").addEventListener("click", function () {
    ajustar(); window.print();
  });

  // Cierra la pestana al terminar (solo si la abrio un script)
  if (p.get("close") === "1") {
    window.addEventListener("afterprint", function () {
      setTimeout(function () { window.close(); }, 300);
    });
  }

  if (p.get("auto") === "0") { ajustar(); return; }

  // Logos van embebidos, pero esperamos decode() por si acaso
  Promise.all(Array.prototype.map.call(document.images, function (img) {
    return img.complete ? Promise.resolve()
      : new Promise(function (r) { img.onload = img.onerror = r; });
  })).then(function () {
    ajustar();
    setTimeout(function () { window.print(); }, 150);
  });
})();
</script>
</body>
</html>
